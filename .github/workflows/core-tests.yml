name: Tests de la logique (hors Unity)

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: tools/test_core.sh
      - run: python3 -m unittest discover -s tools/osm -p "test_*.py"
